; ESP32 Relay Controller - hardware self-test
;
;   pio run -t upload -t monitor
;
; The board is an ESP32-WROOM-32D-N16 (16 MB flash), so the default 4 MB
; partition layout is replaced with one that uses the whole part.

[platformio]
; src_dir = . so the sketch sits beside this file and Arduino IDE can open it
src_dir = .

[env:esp32-relay-controller]
platform  = espressif32
board     = esp32dev
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800   ; 921600 is unreliable through this CH340C

build_flags = -Wall
